[pytest]
# CYBERGUARD AI GRC - Pytest Configuration
# Scoped warning filters for third-party upstream dependencies we do not control.

filterwarnings =
    # Third-party: FastAPI testclient imports httpx which Starlette flags for future httpx2 migration
    ignore:.*Using `httpx` with `starlette.testclient` is deprecated.*
    # Third-party: PuLP 3.3.2 internal deprecation notice for PULP_CBC_CMD ahead of PuLP 4.0 release
    ignore:.*PULP_CBC_CMD is deprecated and will be removed in PuLP 4.0.*:DeprecationWarning:pulp.apis.coin_api
